
name: Maven Unit Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  test:
    name: Run Maven Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Find Maven project and run tests
        shell: bash
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml could not be found!"
            exit 1
          fi

          echo "Maven project found at: $POM"

          mvn --batch-mode --file "$POM" clean test
